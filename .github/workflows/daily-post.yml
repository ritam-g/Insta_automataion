name: Daily Instagram Post

on:
  schedule:
    # Runs every day at 3:30 AM UTC (≈ 9:00 AM IST)
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Instagram Post
        run: node cli/run-daily-post.js
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_TEXT_MODEL: ${{ secrets.GEMINI_TEXT_MODEL }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FALLBACK_IG_USER_ID: ${{ secrets.FALLBACK_IG_USER_ID }}
          FALLBACK_IG_ACCESS_TOKEN: ${{ secrets.FALLBACK_IG_ACCESS_TOKEN }}